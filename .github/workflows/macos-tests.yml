name: macOS tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths:
      - 'server/**'
      - '**/*.gradle'
      - 'gradle/**'
      - '.github/workflows/macos-tests.yml'
  pull_request:
    branches:
      - 'dev'
    paths:
      - 'server/**'
      - '**/*.gradle'
      - 'gradle/**'
      - '.github/workflows/macos-tests.yml'

jobs:
  macos-unit-tests:
    runs-on: macos-15
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    # Same tools as server/scripts/standalone/setup-standalone-env.sh
    - name: Install build tools
      run: brew install milend/taps/hmap xcodegen
    # Integration tests boot the Linux docker stack, which isn't available on macOS runners.
    # spmE2e runs the real xcodegen + xcodebuild package resolution against a public package.
    - name: Run extender tests
      run: ./gradlew server:test -PexcludeTags=integration -PspmE2e=true -i
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos-test-result
        path: ${{ github.workspace }}/server/build/reports/tests/
        retention-days: 10
