name: Snapshot release

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths:
      - '**/*.java'
      - '**/*.gradle'
      - 'gradle/wrapper/**'
      - 'server/src/main/resources/**'
      - '.github/workflows/snapshot-release.yml'

concurrency:
  group: snapshot-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  SNAPSHOT_TAG: dev-snapshot

jobs:
  snapshot:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # full history so the version step can see the extender-v*/client-v*/manifestmergetool-v* tags
        fetch-depth: 0

    - name: Generate version
      id: version
      run: |
        SHORT_SHA="$(echo ${GITHUB_SHA} | cut -c1-8)"

        # Newest release tag for an artifact, patch-bumped. The hardcoded defaults in the build
        # files (server 1.4.47, client/manifestmergetool 0.5.0) are stale, so derive from git.
        next_patch() {
          local glob="$1" fallback="$2" tag ver major minor patch
          tag="$(git tag -l "${glob}" --sort=-v:refname | head -1)"
          if [ -z "${tag}" ]; then
            echo "${fallback}"
            return
          fi
          ver="${tag#*-v}"
          major="${ver%%.*}"
          patch="${ver##*.}"
          minor="${ver#*.}"; minor="${minor%%.*}"
          echo "${major}.${minor}.$((patch + 1))"
        }

        EXTENDER_VERSION="$(next_patch 'extender-v*' '1.4.47')-SNAPSHOT"
        CLIENT_VERSION="$(next_patch 'client-v*' '0.5.0')-SNAPSHOT"
        MANIFESTMERGETOOL_VERSION="$(next_patch 'manifestmergetool-v*' '0.5.0')-SNAPSHOT"

        # baseline for the "merged PRs since last release" section of the notes
        echo "previous_tag=$(git tag -l 'extender-v*' --sort=-v:refname | head -1)" >> $GITHUB_OUTPUT

        echo "extender=${EXTENDER_VERSION}" >> $GITHUB_OUTPUT
        echo "client=${CLIENT_VERSION}" >> $GITHUB_OUTPUT
        echo "manifestmergetool=${MANIFESTMERGETOOL_VERSION}" >> $GITHUB_OUTPUT
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

        # consumed by server/build.gradle:createVersionFile -> Version.gitVersion
        echo "COMMIT_SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

        echo "server=${EXTENDER_VERSION} client=${CLIENT_VERSION} manifestmergetool=${MANIFESTMERGETOOL_VERSION}" >> $GITHUB_STEP_SUMMARY

    - name: Install Java
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    # only unit tests
    - name: Build and test jars
      run: |
        ./gradlew \
          -PextenderVersion=${{ steps.version.outputs.extender }} \
          -PclientVersion=${{ steps.version.outputs.client }} \
          -PmanifestMergetoolVersion=${{ steps.version.outputs.manifestmergetool }} \
          -PexcludeTags="integration" \
          server:bootJar :manifestmergetool:mainJar client:jar \
          server:test client:test :manifestmergetool:test

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: snapshot-test-result
        path: ${{ github.workspace }}/server/build/reports/tests/
        retention-days: 10

    # Fixed asset names so the download URLs never change. The build sha and versions live in
    # the release notes, and Version.java bakes them into the server jar itself.
    - name: Prepare jars for GH release
      run: |
        mkdir -p ${{ github.workspace }}/gh_release
        cp ${{ github.workspace }}/server/build/libs/extender-${{ steps.version.outputs.extender }}.jar \
          ${{ github.workspace }}/gh_release/extender-snapshot.jar
        cp ${{ github.workspace }}/server/manifestmergetool/build/libs/manifestmergetool-${{ steps.version.outputs.manifestmergetool }}.jar \
          ${{ github.workspace }}/gh_release/manifestmergetool-snapshot.jar
        cp ${{ github.workspace }}/client/build/libs/extender-client-${{ steps.version.outputs.client }}.jar \
          ${{ github.workspace }}/gh_release/extender-client-snapshot.jar
        chmod 0444 ${{ github.workspace }}/gh_release/*.jar
        ls -l ${{ github.workspace }}/gh_release

    # The release is edited in place rather than deleted and recreated: recreating it would fire
    # a "new release" notification at every repo watcher on each push to dev.
    - name: Publish to Github pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        EXTENDER_VERSION: ${{ steps.version.outputs.extender }}
        CLIENT_VERSION: ${{ steps.version.outputs.client }}
        MANIFESTMERGETOOL_VERSION: ${{ steps.version.outputs.manifestmergetool }}
        SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
      run: |
        NOTES_FILE="${RUNNER_TEMP}/snapshot-notes.md"
        DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${SNAPSHOT_TAG}"

        git tag -f "${SNAPSHOT_TAG}" "${GITHUB_SHA}"
        git push -f origin "refs/tags/${SNAPSHOT_TAG}"

        # Let GitHub build the merged-PR list, so it matches what --generate-notes produces on a
        # real release (authors, labels/categories, new contributors, compare link). Baseline is
        # the newest extender-v* tag; with none, GitHub falls back to the previous release.
        # Non-fatal: a snapshot is still worth publishing without its changelog.
        NOTES_API_ARGS=(-X POST -f tag_name="${SNAPSHOT_TAG}" -f target_commitish="${GITHUB_SHA}")
        if [ -n "${PREVIOUS_TAG}" ]; then
          NOTES_API_ARGS+=(-f previous_tag_name="${PREVIOUS_TAG}")
        fi
        # gh api writes the error body to stdout on failure, so guard on the exit status too -
        # otherwise a 404 payload would be pasted straight into the release notes.
        if ! CHANGELOG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${NOTES_API_ARGS[@]}" --jq '.body' 2>/dev/null)" || [ -z "${CHANGELOG}" ]; then
          CHANGELOG=""
          echo "::warning::could not generate the merged-PR list; publishing notes without it"
        fi

        {
          printf '%s\n\n' 'Rolling build of the latest `dev` commit. **Not a supported release** - unsigned, and verified by unit tests only (the integration suite runs on tagged releases).'
          printf '| Artifact | Version | Download |\n'
          printf '| --- | --- | --- |\n'
          printf '| server | `%s` | [extender-snapshot.jar](%s/extender-snapshot.jar) |\n' "${EXTENDER_VERSION}" "${DOWNLOAD_URL}"
          printf '| manifestmergetool | `%s` | [manifestmergetool-snapshot.jar](%s/manifestmergetool-snapshot.jar) |\n' "${MANIFESTMERGETOOL_VERSION}" "${DOWNLOAD_URL}"
          printf '| client | `%s` | [extender-client-snapshot.jar](%s/extender-client-snapshot.jar) |\n\n' "${CLIENT_VERSION}" "${DOWNLOAD_URL}"
          printf '**Commit** [`%s`](%s/%s/commit/%s) - %s\n\n' "${SHORT_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "$(git log -1 --pretty=%s)"
          printf '**Built** %s from [run #%s](%s/%s/actions/runs/%s)\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "${GITHUB_RUN_NUMBER}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          if [ -n "${CHANGELOG}" ]; then
            printf '\n---\n\n%s\n' "${CHANGELOG}"
          fi
        } > "${NOTES_FILE}"

        if ! gh release view "${SNAPSHOT_TAG}" > /dev/null 2>&1; then
          gh release create "${SNAPSHOT_TAG}" \
            --prerelease \
            --title "Development snapshot (dev)" \
            --notes-file "${NOTES_FILE}"
        fi

        # --latest=false is belt-and-braces: pre-releases are already excluded from "Latest",
        # so the newest extender-v* release keeps that badge.
        gh release edit "${SNAPSHOT_TAG}" \
          --prerelease \
          --latest=false \
          --title "Development snapshot (dev)" \
          --notes-file "${NOTES_FILE}"

        gh release upload "${SNAPSHOT_TAG}" ${{ github.workspace }}/gh_release/*.jar --clobber

        cat "${NOTES_FILE}" >> $GITHUB_STEP_SUMMARY

    - name: Notify if build failed
      uses: lazy-actions/slatify@cd4b4a1158cfb3e26fe1ee35c1cd4f0247dfbf96
      if: failure()
      with:
        type: ${{ job.status }}
        job_name: 'Extender dev snapshot'
        channel: '#defold-alarms-build'
        url: ${{ secrets.SLACK_WEBHOOK }}
