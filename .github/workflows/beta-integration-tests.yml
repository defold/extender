name: Beta integration tests

on:
  push:
    branches:
      - 'beta'
    paths:
      - '**/*.java'
      - '**/*.gradle'
      - 'gradle/wrapper/**'
      - 'server/src/main/resources/**'
      - 'server/configs/**'
      - 'server/docker/**'
      - 'server/scripts/**'
      - 'server/test-data/**'
      - 'server/users/**'
      - '.github/workflows/beta-integration-tests.yml'

concurrency:
  group: beta-integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOOGLE_ARTIFACT_REGISTRY: europe-west1-docker.pkg.dev

jobs:
  integration-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    # the 'test' compose profile pulls 8 builder images; the default runner disk is not enough
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false # to keep gcloud cli
        docker-images: true
        swap-storage: true
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
    # both jars are bind-mounted into every test container by docker-compose, and
    # server/scripts/start-test-server.sh refuses to start without them. Building them up front
    # fails fast on a compile error, before we spend minutes pulling images.
    - name: Build jars
      run: ./gradlew server:bootJar :manifestmergetool:mainJar
    - name: Login to Google Artifact registry (Docker)
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ${{ env.GOOGLE_ARTIFACT_REGISTRY }}
        username: _json_key
        password: ${{ secrets.DOCKER_REGISTRY_JSON_KEY }}
    - name: Pull necessary docker images
      run: |
        # pull all containers under profile 'test'. Part of them is used in 'auth-test'
        docker compose --file ./server/docker/docker-compose.yml --profile test pull
    # no -PexcludeTags: this is what lets IntegrationTest/AuthenticationTest run. They bring the
    # docker stack up and down themselves via server/scripts/start-test-server.sh.
    - name: Run extender tests
      run: ./gradlew server:test -i
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-result
        path: ${{ github.workspace }}/server/build/reports/tests/
        retention-days: 10
