name: CodeQL

on:
  push:
    branches:
      - 'dev'
    paths:
      - '**/*.java'
  pull_request:
    branches:
      - 'dev'
    paths:
      - '**/*.java'
  schedule:
    - cron: '0 2 * * 1'

jobs:
  codeql_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java
          config-file: ./.github/codeql/codeql-config.yml
      # Build the main source sets only. CodeQL extracts what the build compiles, so this
      # is what actually keeps test sources out of the scan - paths-ignore does not apply
      # to a compiled language that is analysed with a traced build.
      - name: Build main sources
        run: ./gradlew --no-daemon classes
      - name: Perform analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
