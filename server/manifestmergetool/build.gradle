buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java-library'
}

ext {
    manifestMergetoolVersion = findProperty('manifestMergetoolVersion') ?: '0.5.0'
}

jar {
    archiveBaseName = '_manifestmergetool'
    enabled = true
    archiveClassifier = '' // use empty string to avoid the 'plain' suffix
}


configurations {
    // Resolvable configuration for shading contents into the fat jar
    implementationResolved {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom implementation
    }
    all*.exclude group: 'com.android.tools', module: 'repository'
    all*.exclude group: 'com.android.tools', module: 'sdklib'
}

task mainJar(type: Jar) {
    version =  project.ext.manifestMergetoolVersion
    archiveBaseName = 'manifestmergetool'
    manifest {
        attributes 'Main-Class': 'com.defold.manifestmergetool.ManifestMergeTool'
    }
    from {
        configurations.implementationResolved.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    duplicatesStrategy = DuplicatesStrategy.WARN
    with jar
        doLast {
        copy {
            from "${project.projectDir}/build/libs/manifestmergetool-${project.ext.manifestMergetoolVersion}.jar"
            into "${project.projectDir}/../app"
            rename { String fileName ->
                fileName.replace("-$project.ext.manifestMergetoolVersion", "")
            }
        }
    }
}

if (project.hasProperty('publishToGar')) {
    apply plugin: 'com.google.cloud.artifactregistry.gradle-plugin'
    publishing {
        publications {
            manifestMergeTool(MavenPublication) {
            artifact mainJar
            groupId = 'com.defold.extender'
            artifactId = 'manifestmergetool'
            version = project.ext.manifestMergetoolVersion
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = uri("https://maven.google.com") }
}

dependencies {
    implementation('org.jsoup:jsoup:1.22.2')
    implementation('com.android.tools.build:manifest-merger:31.4.1')
    implementation('com.android.tools:common:31.4.1')
    implementation('org.apache.commons:commons-configuration2:2.15.1')
    implementation('commons-codec:commons-codec:1.21.0')

    constraints {
        implementation('org.apache.httpcomponents:httpclient:4.5.14') { because 'CVE-2020-13956' }
        implementation('org.apache.httpcomponents:httpmime:4.5.14') { because 'keep in sync with httpclient' }
        implementation('org.apache.commons:commons-compress:1.28.0') { because 'CVE-2024-25710, CVE-2024-26308' }
    }

    testImplementation(platform('org.junit:junit-bom:6.0.3'))
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('commons-io:commons-io:2.21.0')
    testImplementation('org.junit.jupiter:junit-jupiter-engine:6.0.3')
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

test {
    useJUnitPlatform()
}
