import java.text.SimpleDateFormat
import java.util.Date

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:4.1.0'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.0'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.13"
}

apply plugin: 'io.spring.dependency-management'

ext {
    extenderVersion = findProperty('extenderVersion') ?: '1.4.47'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.fasterxml.jackson.core') {
            // jackson-annotations tags only the minor version (e.g. "2.21"), unlike jackson-core/-databind's patch releases
            details.useVersion(details.requested.name == 'jackson-annotations' ? '2.21' : '2.21.5')
            details.because 'CVE-2026-54512/54513/54514/54515/54516/54517/54518 - align transitive Jackson 2.x pulled in by google-cloud-storage'
        }
        if (details.requested.group == 'ch.qos.logback') {
            details.useVersion('1.5.38')
            details.because 'CVE-2026-9828, CVE-2026-10532'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(platform("com.google.cloud:spring-cloud-gcp-dependencies:8.1.0"))
    implementation(platform("tools.jackson:jackson-bom:3.1.5"))
    testImplementation(platform("org.junit:junit-bom:6.1.2"))

    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude module: 'spring-boot-starter-tomcat'
    }

    implementation('com.googlecode.json-simple:json-simple:1.1.1') {
        exclude module: 'junit'
    }

    implementation('com.google.cloud:spring-cloud-gcp-starter-storage')
    implementation('com.google.cloud:spring-cloud-gcp-starter-logging')
    implementation('com.google.cloud:google-cloud-compute:1.104.0')
    implementation('com.samskivert:jmustache:1.16')
    implementation('commons-chain:commons-chain:1.2')
    implementation('tools.jackson.core:jackson-databind')
    implementation('org.apache.commons:commons-fileupload2-jakarta:2.0.0-M1')
    implementation('org.apache.commons:commons-fileupload2-core:2.0.0-M5')
    implementation('org.apache.commons:commons-text:1.15.0')
    implementation('org.apache.commons:commons-compress:1.28.0')
    implementation('org.apache.commons:commons-lang3:3.20.0')
    implementation('org.apache.httpcomponents:httpclient:4.5.14')
    implementation('org.apache.httpcomponents:httpmime:4.5.14')
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('org.springframework.boot:spring-boot-starter-jetty')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('org.springframework.boot:spring-boot-starter-micrometer-metrics')
    implementation('org.springframework.boot:spring-boot-micrometer-tracing')
    implementation('org.springframework.boot:spring-boot-micrometer-tracing-brave')
    implementation('io.micrometer:micrometer-tracing-bridge-brave')

    implementation('org.projectlombok:lombok:1.18.46')
    annotationProcessor('org.projectlombok:lombok:1.18.46')

    runtimeOnly('net.logstash.logback:logstash-logback-encoder:9.0')
    runtimeOnly('io.micrometer:micrometer-registry-prometheus') {
        exclude group: 'org.junit.jupiter'
    }

    testImplementation('org.junit.jupiter:junit-jupiter-engine')
    testImplementation('org.junit.jupiter:junit-jupiter-params')
    testImplementation('org.springframework:spring-test')
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.jupiter'
    }
    testImplementation('io.micrometer:micrometer-tracing-test') {
        exclude group: 'org.junit.jupiter'
    }
    testImplementation('io.micrometer:micrometer-tracing-integration-test') {
        exclude group: 'org.junit.jupiter'
    }
    testImplementation('org.springframework.security:spring-security-test')

    testImplementation('org.smali:dexlib2:2.5.2')
    testImplementation project(':client')
    testImplementation('org.wiremock:wiremock-standalone:3.13.2')
}

task createVersionFile() {
    def sha = System.getenv("COMMIT_SHORT_SHA")
    if (sha == null) {
        def outputStream = new ByteArrayOutputStream()
        try {
            def gen_result = exec {
                commandLine "git", "rev-parse", "--short", "HEAD"
                standardOutput = outputStream
                ignoreExitValue = true
            }
            if (gen_result.exitValue == 0 ) {
                sha = outputStream.toString().trim()
            } else {
                sha = "unknown_commit"
            }
        } catch (Exception exc) {
            sha = "unknown_commit"
        }
    }
    def build_time = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date ())
    def app_version = project.ext.extenderVersion
    def text = """
// Auto generated by gradle

package com.defold.extender;
public class Version {
    public static final String gitVersion = "${sha}";
    public static final String buildTime = "${build_time}";
    public static final String appVersion = "${app_version}";
}
"""
    def binding = []

    def engine = new groovy.text.SimpleTemplateEngine()
    def template = engine.createTemplate(text).make(binding)

    new File(projectDir.toString() + "/src/main/java/com/defold/extender", "Version.java").text = template.toString()
    project.ext.set("outSha", sha)
}

compileJava {
    dependsOn createVersionFile
}

// Creates the full jar file, with the extender server classes included
bootJar {
    archiveBaseName = 'extender'
    version = project.ext.extenderVersion
    // See the note on :manifestmergetool:mainJar - server/app/extender.jar is what the docker
    // containers run, so it is declared as an output and restored if deleted.
    outputs.file("${project.projectDir}/app/extender.jar")
    doLast {
        copy {
            from "${project.projectDir}/build/libs/extender-${project.ext.extenderVersion}.jar"
            into "app"
            rename { String fileName ->
                fileName.replace("-$project.ext.extenderVersion", "")
            }
        }
    }
}

// Builds the extender server base classes into a .jar file
jar {
    archiveBaseName = 'extender-base'
    version = project.ext.extenderVersion
    archiveClassifier = '' // use empty string to avoid the 'plain' suffix
}

if (project.hasProperty('publishToGar')) {
    apply plugin: 'com.google.cloud.artifactregistry.gradle-plugin'
    publishing {
        publications {
            extender(MavenPublication) {
            artifact bootJar
            groupId = 'com.defold.extender'
            artifactId = 'server'
            version = project.ext.extenderVersion
            }
        }
    }
}

task buildStandalone() {
    dependsOn 'build', ':manifestmergetool:mainJar'
    doLast {
        copy {
            from(project.projectDir) {
                include "users/**"
            }
            into "build/standalone"
        }
        copy {
            from("docker-base") {
                include "template.*"
            }
            into "build/standalone"
        }
        // .archiveFile, not the task itself: a task reference resolves to *all* of its outputs,
        // which now includes the server/app/ copy declared above.
        copy {
            from bootJar.archiveFile
            into "build/standalone"
        }
        copy {
            from project(':manifestmergetool').tasks.withType(Jar).collect { it.archiveFile }
            into "build/standalone"
        }
    }
}

test {
    useJUnitPlatform {
        if (project.hasProperty("excludeTags")) {
            excludeTags project.getProperty("excludeTags")
        }
    }
    // The integration and auth tests boot the docker stack, which bind-mounts server/app/ into
    // every container: extender.jar is what they run, and manifestmergetool.jar is invoked as a
    // subprocess by the sdk's manifestMergeCmd (e.g. IntegrationTest.buildAndroidLocalAar).
    // CI's coverage job passes -PexcludeTags=integration and skips the jar build entirely.
    def excludedTags = (project.findProperty("excludeTags") ?: "").toString().split(",")*.trim()
    if (!excludedTags.contains("integration")) {
        dependsOn 'bootJar', ':manifestmergetool:mainJar'
    }
    // Opt-in knobs to shrink a local integration test run. All absent in CI, where they are no-ops.
    //   -PtargetPlatforms=x86_64-linux,js-web   only build these targets, and only boot the
    //                                           builders they need (see docker-compose.yml profiles)
    //   -PdefoldVersions=all|ci|latest|1.12.3   which Defold SDK versions to test against
    //   -PreuseStack=true                       leave the docker stack running between runs
    ["targetPlatforms", "defoldVersions", "reuseStack"].each { name ->
        if (project.hasProperty(name)) {
            systemProperty "extender.test.${name}", project.getProperty(name)
        }
    }
    //   -PbuildSleepTimeout=500                 poll job status every 500ms instead of the client
    //                                           default 5000ms - each async build waits at least one
    //                                           full interval before its first status check
    if (project.hasProperty("buildSleepTimeout")) {
        systemProperty "com.defold.extender.client.build-sleep-timeout", project.getProperty("buildSleepTimeout")
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test // tests must run before report
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}
