server:
    port: 9000
    max-http-request-header-size: 16KB
    jetty:
        connection-idle-timeout: 600000
        # Jetty reuses maxFormKeys as the multipart part limit, i.e. the max number of files
        # in a build request.
        max-form-keys: 5000

extender:
    sdk:
        location: /var/extender/sdk
        # Slightly bigger than production in order to not remove version controlled SDK
        cache-size: 10
        mappings-cache-size: 20
        cache-clear-on-exit: true
        sdk-urls: >
            https://d.defold.com/archive/stable/%s/engine/defoldsdk.zip,
            https://d.defold.com/archive/%s/engine/defoldsdk.zip
        mappings-urls: >
            https://d.defold.com/archive/stable/%s/engine/platform.sdks.json,
            https://d.defold.com/archive/%s/engine/platform.sdks.json
        max-verification-retry-count: 3
        enable-sdk-verification: true
    server:
        http:
            idle-timeout: 600000
    cache:
        enabled: false
        file-size-threshold: 65536
    remote-builder:
        enabled: false
        build-sleep-timeout: 5000
        build-result-wait-timeout: 1200000
        connect-timeout: 30000
        connection-request-timeout: 30000
        # per-read inactivity limit; a download making progress is never cut off
        socket-timeout: 120000
        max-connections: 35
        result-download-retries: 3
        result-download-retry-delay: 5000
    gradle:
        enabled: false
        location: /tmp/.gradle
    # Landlock/seccomp/rlimit sandbox around every build subprocess (compilers, linkers, emcc,
    # gradle, dotnet, R8, manifest merge tool). Needs /usr/local/bin/extender-sandbox in the
    # image. Landlock is an allowlist: everything a toolchain reads must be under
    # read-only-paths (the SDK, the job directory and MANIFEST_MERGE_TOOL are added
    # automatically). Never mount secrets under a granted path. Image-specific writable state
    # (emscripten cache, wine prefix, ...) is supplied by the image as
    # EXTENDER_SANDBOX_IMAGEREADWRITEPATHS (comma separated) and merged with read-write-paths.
    sandbox:
        enabled: false
        launcher-path: /usr/local/bin/extender-sandbox
        # fail startup when the kernel offers no Landlock/seccomp instead of running degraded
        strict: true
        # wall-clock limit per subprocess, ms
        command-timeout: 1200000
        read-only-paths: >
            /usr,/lib,/lib64,/lib32,/bin,/sbin,/opt,/proc,/sys,
            /etc/ld.so.cache,/etc/ld.so.conf,/etc/ld.so.conf.d,/etc/passwd,/etc/group,
            /etc/nsswitch.conf,/etc/localtime,/etc/timezone,/etc/alternatives,/etc/ssl,
            /etc/ca-certificates,/etc/hosts,/etc/resolv.conf,/etc/host.conf,/etc/gai.conf,
            /etc/fonts,/etc/os-release,/etc/mime.types,/etc/python3,/etc/python3.10,/etc/wine
        read-write-paths: /dev
        read-write-exec-paths: ''
        image-read-write-paths: ''
        # variables matching these regexes are not passed to subprocesses
        env-deny-patterns:
            - '.*(TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL|API_KEY|PRIVATE_KEY).*'
            - 'GOOGLE_APPLICATION_CREDENTIALS'
            - 'AWS_.*'
            - 'EXTENDER_.*'
            - 'SPRING_.*'
            - 'DM_PACKAGES_URL'
            - 'JAVA_TOOL_OPTIONS'
            - '_JAVA_OPTIONS'
            - 'JDK_JAVA_OPTIONS'
        limits:
            # RLIMIT_CPU sums CPU time across threads and would kill multi-threaded
            # linkers/wasm-opt; the wall-clock command-timeout bounds runtime instead. 0 = off.
            cpu-seconds: 0
            # RLIMIT_NPROC is per uid and also counts the server JVM's threads
            max-processes: 4096
            max-file-size-bytes: 8589934592
            max-open-files: 16384
    # Resource limits for untrusted R8 input; byte limits use expanded sizes.
    r8:
        max-generated-extension-classes: 32768
        max-classfile-header-bytes: 4194304
        max-total-classfile-header-bytes: 67108864
        max-rule-files: 1024
        max-rule-file-bytes: 1048576
        max-total-rule-bytes: 16777216
    cocoapods:
        enabled: false
        cdn-concurrency: 10 # value for COCOAPODS_CDN_MAX_CONCURRENCY
        home-dir-prefix: /tmp/.cocoapods
        repo-update-cron: "0 0 * * * *" # update spec repo every 1 h
        cache-dir-rotate-cron: "0 10 2 * * *" # once per day
        old-cache-clean-cron: "0 10 6 * * *" # once per day after directory rotation
    spm:
        enabled: false
        home-dir-prefix: /tmp/.swiftpm
        # DEVELOPER_DIR is selected per build: the job's XCODE_VERSION is looked up in
        # the (optional) xcode-developer-dirs map, falling back to default-developer-dir:
        #   xcode-developer-dirs:
        #       "26.2": /Applications/Xcode_26.2.app/Contents/Developer
        default-developer-dir: /Applications/Xcode.app/Contents/Developer
        xcodegen-path: xcodegen
        wrapper-mach-o-type: staticlib # staticlib | mh_dylib
        swift-version: "6.0"
        cache-dir-rotate-cron: "0 20 2 * * *" # once per day
        old-cache-clean-cron: "0 20 6 * * *" # once per day after directory rotation
    # refer to README_SECURITY.md for information on securing your server
    authentication:
        # empty string, all platforms allowed without authentication
        platforms: ''
        # no user definitions are needed since we require no authentication for any platform
        users: ''
        # check for user updates every 15 minutes
        update-interval: 900000
    job-result:
        location: /tmp/results
        cleanup-period: 20000
        lifetime: 1200000
    # live build progress over Server-Sent Events (GET /job_progress?jobId=)
    progress:
        enabled: true
        # SseEmitter timeout, ms (~ remote-builder build-result-wait-timeout)
        sse-timeout: 1800000
        # SSE comment keepalive, ms (must be < jetty connection-idle-timeout)
        heartbeat-interval: 15000
        # per-job replay ring buffer for Last-Event-ID reconnects
        event-buffer-size: 256
        max-subscribers-per-job: 8
        # orphan sweep for jobs that died without a terminal event
        registry-ttl: 1200000
        cleanup-period: 20000
    # see ExtenderController.InstanceType enum
    # FRONTEND_ONLY, BUILDER_ONLY, MIXED
    instance-type: MIXED

spring:
    application:
        name: extender
    servlet:
        multipart:
            enabled: true
            max-file-size: 1024MB
            max-request-size: 1024MB
    # Don't check for templates on startup
    mustache:
        check-template-location: false
    threads:
        virtual:
            enabled: false

# All management endpoints except simple health status are disabled for security reasons
endpoints:
    enabled: false
    health:
        enabled: true
        sensitive: false

# Increase thread name size, to make the job name more visible
logging.pattern.console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.23t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

management:
    health:
        diskspace:
            path: /
            threshold: 1073741824 #1024mb

spring.cloud.gcp:
    core.enabled: false
    storage.enabled: false
    logging.enabled: false
