server:
    port: 9010

extender:
    instance-type: MIXED
    sdk:
        location: /usr/local/extender/sdk
        cache-clear-on-exit: false
    cache:
        enabled: false
    remote-builder:
        enabled: false
    cocoapods:
        enabled: true
        home-dir-prefix: /tmp/extender/.cocoapods
        repo-update-cron: "0 0 * * * *" # update spec repo every 1 h
        cache-dir-rotate-cron: "0 10 2 * * *" # once per day
        old-cache-clean-cron: "0 10 6 * * *" # once per day after directory rotation
    spm:
        enabled: true
        home-dir-prefix: /tmp/extender/.swiftpm
        default-developer-dir: /Applications/Xcode.app/Contents/Developer
        xcodegen-path: /opt/homebrew/bin/xcodegen
        cache-dir-rotate-cron: "0 20 2 * * *" # once per day
        old-cache-clean-cron: "0 20 6 * * *" # once per day after directory rotation
    # Seatbelt sandbox around every build subprocess. The launcher is compiled by
    # scripts/standalone/setup-standalone-env.sh into server/app/extender-sandbox and its
    # path is exported as EXTENDER_SANDBOX_LAUNCHERPATH by envs/generate_user_env.sh; set
    # EXTENDER_SANDBOX_ENABLED=false in user.env to run without it.
    sandbox:
        enabled: true
