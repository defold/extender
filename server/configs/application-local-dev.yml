extender:
    instance-type: BUILDER_ONLY
    # every builder image built from extender-base-env >= 1.8.0 ships the launcher;
    # override with EXTENDER_SANDBOX_ENABLED=false / EXTENDER_SANDBOX_STRICT=false on older hosts
    sandbox:
        enabled: true
    # sdk.location: /usr/local/extender/sdk
    cache:
        enabled: true
        local.basedir: /var/extender/cache/data
        type: LOCAL

    job-result:
        location: /var/extender/results
        cleanup-period: 20000

logging.pattern.level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"